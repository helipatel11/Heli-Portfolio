<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t  { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .b  { font-size: 14px; fill: #334155; }
      .s  { font-size: 13px; fill: #475569; }
      .lb { font-size: 13px; fill: #1e293b; font-weight: 600; }
      .ln { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arr); }
      .dash { stroke-dasharray: 6 5; }
      .mono { font-family: Menlo, 'SF Mono', Consolas, monospace; font-size: 13px; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="52" style="font-size:24px;font-weight:700;fill:#0f172a">LLMOps Support Assistant: architecture</text>

  <!-- ===== Left lane: build & release ===== -->
  <rect x="40" y="100" width="340" height="140" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="132" class="t">Dev machine</text>
  <text x="60" y="160" class="b">Training &amp; evaluation</text>
  <text x="60" y="184" class="b">MLflow experiment tracking</text>
  <text x="60" y="208" class="b">Model, configs &amp; prompts versioned in git</text>

  <rect x="40" y="300" width="340" height="140" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="332" class="t">GitHub Actions</text>
  <text x="60" y="360" class="b">PR: ruff + pytest gate</text>
  <text x="60" y="384" class="b">main: build image <tspan class="mono">:git-sha</tspan></text>
  <text x="60" y="408" class="b">AWS login via OIDC, no stored keys</text>

  <rect x="40" y="510" width="340" height="100" rx="12" fill="#fff8ee" stroke="#e8a33d" stroke-width="1.5"/>
  <text x="60" y="542" class="t">Amazon ECR</text>
  <text x="60" y="570" class="b">Immutable <tspan class="mono">:git-sha</tspan> tags</text>

  <rect x="40" y="690" width="340" height="120" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="722" class="t">Terraform</text>
  <text x="60" y="750" class="b">VPC · security group · EC2 · ECR · IAM</text>
  <text x="60" y="774" class="b">cloud-init installs k3s, Ollama, models</text>

  <path d="M210,240 L210,298" class="ln"/>
  <text x="222" y="275" class="lb">git push</text>
  <path d="M210,440 L210,508" class="ln"/>
  <text x="222" y="480" class="lb">push image</text>

  <!-- ===== Admin ===== -->
  <rect x="820" y="40" width="280" height="56" rx="28" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="960" y="74" text-anchor="middle" class="t">Me (admin)</text>

  <!-- ===== AWS / EC2 ===== -->
  <rect x="440" y="140" width="1120" height="820" rx="16" fill="#fffbf5" stroke="#e8a33d" stroke-width="2"/>
  <text x="460" y="166" class="lb" style="fill:#9a5b00">AWS · VPC</text>

  <rect x="470" y="180" width="1060" height="760" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="490" y="208" class="lb">EC2 t3.large · IMDSv2 · instance role</text>

  <!-- k3s -->
  <rect x="500" y="222" width="680" height="690" rx="14" fill="#f3f7ff" stroke="#326ce5" stroke-width="2"/>
  <text x="520" y="250" class="lb" style="fill:#1d4ed8">k3s (Kubernetes) · namespace llmops</text>

  <!-- Traefik -->
  <rect x="530" y="270" width="620" height="60" rx="10" fill="#ffffff" stroke="#326ce5" stroke-width="1.5"/>
  <text x="550" y="306" class="t">Traefik ingress</text>
  <text x="780" y="306" class="mono">/ → API</text>
  <text x="900" y="306" class="mono">/grafana → Grafana</text>

  <!-- Deployment -->
  <rect x="530" y="370" width="350" height="350" rx="12" fill="#e8f0ff" stroke="#326ce5" stroke-width="1.5"/>
  <text x="548" y="398" class="lb" style="fill:#1d4ed8">support-assistant · HPA 2–5 pods (CPU)</text>
  <!-- stacked pods -->
  <rect x="571" y="436" width="300" height="276" rx="10" fill="#ffffff" stroke="#93b4f5" stroke-width="1.2"/>
  <rect x="563" y="428" width="300" height="276" rx="10" fill="#ffffff" stroke="#93b4f5" stroke-width="1.2"/>
  <rect x="555" y="420" width="300" height="276" rx="10" fill="#ffffff" stroke="#326ce5" stroke-width="1.5"/>
  <text x="572" y="446" class="lb">Pod</text>
  <rect x="572" y="456" width="266" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="586" y="480" class="b" style="font-weight:600">init: ingest</text>
  <text x="586" y="502" class="s">builds ChromaDB index (emptyDir)</text>
  <rect x="572" y="530" width="266" height="152" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="586" y="554" class="b" style="font-weight:600">FastAPI</text>
  <text x="586" y="580" class="mono">POST /predict</text>
  <text x="712" y="580" class="s">TF-IDF + LogReg</text>
  <text x="586" y="604" class="mono">POST /ask</text>
  <text x="712" y="604" class="s">RAG</text>
  <text x="586" y="628" class="mono">GET  /version</text>
  <text x="586" y="652" class="mono">/ready /health /metrics</text>

  <path d="M705,330 L705,368" class="ln"/>

  <!-- Rollout note -->
  <rect x="530" y="748" width="350" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="548" y="776" class="lb">Zero-downtime rollouts</text>
  <text x="548" y="802" class="s">maxUnavailable 0 · readiness-gated</text>
  <text x="548" y="826" class="s">release: <tspan class="mono">deploy.sh &lt;git-sha&gt;</tspan></text>
  <text x="548" y="848" class="s">rollback: <tspan class="mono">kubectl rollout undo</tspan></text>

  <!-- Monitoring -->
  <rect x="910" y="400" width="240" height="130" rx="12" fill="#fff4f2" stroke="#e5534b" stroke-width="1.5"/>
  <text x="928" y="432" class="t">Grafana</text>
  <text x="928" y="460" class="b">Dashboard as code</text>
  <text x="928" y="484" class="b">rate · errors · duration</text>

  <rect x="910" y="590" width="240" height="140" rx="12" fill="#fff4f2" stroke="#e5534b" stroke-width="1.5"/>
  <text x="928" y="622" class="t">Prometheus</text>
  <text x="928" y="650" class="b">Scrapes every pod</text>
  <text x="928" y="674" class="b">Alert rules</text>
  <text x="928" y="698" class="s">not exposed (ClusterIP)</text>

  <path d="M1030,330 L1030,398" class="ln"/>
  <path d="M1030,530 L1030,588" class="ln"/>
  <text x="1042" y="565" class="lb">queries</text>
  <path d="M910,660 L857,660" class="ln dash"/>
  
  <!-- Ollama (outside k8s) -->
  <rect x="1220" y="400" width="280" height="220" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1240" y="432" class="t">Ollama</text>
  <text x="1240" y="456" class="s" style="fill:#6d28d9;font-weight:600">systemd on the node, outside k8s</text>
  <text x="1240" y="490" class="b">tinyllama</text>
  <text x="1240" y="512" class="s">answer generation</text>
  <text x="1240" y="546" class="b">nomic-embed-text</text>
  <text x="1240" y="568" class="s">embeddings (init container + /ask)</text>

  <!-- API -> Ollama -->
  <path d="M838,640 L895,640 L895,885 L1360,885 L1360,622" class="ln"/>
  <rect x="1150" y="861" width="212" height="20" rx="4" fill="#ffffff"/>
  <text x="1156" y="876" class="lb">embed + generate (via node IP)</text>

  <!-- ECR pull -->
  <path d="M380,560 L553,560" class="ln"/>
  <rect x="386" y="535" width="146" height="20" rx="4" fill="#ffffff"/>
  <text x="392" y="550" class="lb">pull (instance role)</text>

  <!-- Terraform provisions -->
  <path d="M380,750 L468,750" class="ln"/>
  <rect x="386" y="725" width="62" height="20" rx="4" fill="#ffffff"/>
  <text x="390" y="740" class="lb">creates</text>
  <!-- admin access (drawn last so it sits on top) -->
  <path d="M960,96 L960,268" class="ln"/>
  <rect x="969" y="107" width="222" height="20" rx="4" fill="#ffffff"/>
  <text x="975" y="122" class="lb">only my IP: HTTP :80, SSH :22</text>
</svg>
